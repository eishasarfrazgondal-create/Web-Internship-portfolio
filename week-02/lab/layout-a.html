<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout A - Article Card</title>
    <link rel="stylesheet" href="layouts.css">
</head>

<body class="layout-a">

    <main>
        <article class="article-card">

            <h1>Article Title</h1>

            <p class="article-meta">
                By Intern | 3 min read
            </p>

            <p>
                This article explains important ideas about
                technology and software development.
            </p>

            <h2>Section Heading</h2>

            <p>
                Learning new technologies helps us understand
                how modern websites work.
            </p>

            <a href="#">Read more</a>

            <footer>
                <p>Footer note</p>
            </footer>

        </article>
    </main>

</body>
</html>
