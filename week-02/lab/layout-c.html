<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout C - Profile Card</title>
    <link rel="stylesheet" href="layouts.css">
</head>

<body class="layout-c">

    <main>

        <article class="profile-card">

            <div class="avatar">IN</div>

            <h1>Intern Name</h1>

            <p class="role">Software Engineering Intern</p>

            <p class="description">
                Learning web development and building
                practical projects.
            </p>

            <section class="stats">

                <div class="stat">
                    <strong>13</strong>
                    <p>Weeks</p>
                </div>

                <div class="stat">
                    <strong>4</strong>
                    <p>Phases</p>
                </div>

                <div class="stat">
                    <strong>1</strong>
                    <p>Capstone</p>
                </div>

            </section>

            <a href="#" class="portfolio-button">
                View portfolio
            </a>

        </article>

    </main>

</body>
</html>
